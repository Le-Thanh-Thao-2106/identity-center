<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Đăng ký | Identity Center</title>
        <link rel="stylesheet" href="/css/portal.css?v=portal-1" />
        <link rel="stylesheet" href="/css/auth-motion.css?v=motion-1" />
    </head>
    <body class="identity-site">
        <main class="identity-shell">
            <header class="identity-topbar">
                <div class="identity-brand">
                    <span class="identity-mark" aria-hidden="true">◉</span>
                    <div>
                        <strong>Identity Center</strong>
                        <small>Không gian ứng dụng</small>
                    </div>
                </div>
            </header>
            <div class="identity-auth motion-stage" data-mode="register">
                <section
                    inert
                    aria-hidden="true"
                    data-form-mode="login"
                    class="identity-form-panel"
                    aria-labelledby="login-identityHeading"
                >
                    <nav class="identity-segment" aria-label="Thao tác tài khoản">
                        <a href="/login.html" data-change-mode="login" aria-current="page"
                            >Đăng nhập</a
                        >
                        <a href="/register.html" data-change-mode="register">Đăng ký</a>
                    </nav>
                    <div class="identity-form-title">
                        <h2 id="login-identityHeading">Chào mừng trở lại</h2>
                        <p>Đăng nhập để mở danh sách ứng dụng.</p>
                    </div>
                    <p class="identity-message" id="login-authMessage" role="status" hidden></p>
                    <form
                        id="login-identityForm"
                        class="identity-form"
                        data-mode="login"
                        autocomplete="off"
                    >
                        <label class="identity-field" for="login-email">
                            Email
                            <input
                                id="login-email"
                                type="email"
                                placeholder="ban@example.com"
                                maxlength="254"
                                autocapitalize="none"
                                spellcheck="false"
                                required
                            />
                        </label>
                        <div class="identity-field">
                            <label for="login-password">Mật khẩu</label>
                            <div class="identity-password">
                                <input
                                    id="login-password"
                                    type="password"
                                    placeholder="Nhập mật khẩu"
                                    autocomplete="off"
                                    maxlength="128"
                                    required
                                />
                                <button
                                    id="login-passwordToggle"
                                    type="button"
                                    class="identity-action"
                                    aria-label="Hiện mật khẩu"
                                    aria-pressed="false"
                                >
                                    <span class="password-eye" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>

                        <button class="identity-action primary" type="submit" disabled>
                            Đăng nhập
                        </button>
                        <button class="identity-action quiet" type="button" data-cancel-auth hidden>
                            Hủy
                        </button>
                    </form>
                </section>
                <section
                    data-form-mode="register"
                    class="identity-form-panel"
                    aria-labelledby="register-identityHeading"
                >
                    <nav class="identity-segment" aria-label="Thao tác tài khoản">
                        <a href="/login.html" data-change-mode="login">Đăng nhập</a>
                        <a href="/register.html" data-change-mode="register" aria-current="page"
                            >Đăng ký</a
                        >
                    </nav>
                    <div class="identity-form-title">
                        <h2 id="register-identityHeading">Tạo tài khoản</h2>
                        <p>Tạo tài khoản để sử dụng các ứng dụng trong Identity Center.</p>
                    </div>
                    <p class="identity-message" id="register-authMessage" role="status" hidden></p>
                    <form
                        id="register-identityForm"
                        class="identity-form"
                        data-mode="register"
                        autocomplete="off"
                    >
                        <label class="identity-field" for="register-fullName">
                            Họ và tên
                            <input
                                id="register-fullName"
                                type="text"
                                placeholder="Nguyễn Minh An"
                                maxlength="120"
                                required
                            />
                        </label>

                        <label class="identity-field" for="register-email">
                            Email
                            <input
                                id="register-email"
                                type="email"
                                placeholder="ban@example.com"
                                maxlength="254"
                                autocapitalize="none"
                                spellcheck="false"
                                required
                            />
                        </label>
                        <div class="identity-field">
                            <label for="register-password">Mật khẩu</label>
                            <div class="identity-password">
                                <input
                                    id="register-password"
                                    type="password"
                                    placeholder="Ít nhất 8 ký tự"
                                    autocomplete="new-password"
                                    minlength="8"
                                    maxlength="128"
                                    required
                                />
                                <button
                                    id="register-passwordToggle"
                                    type="button"
                                    class="identity-action"
                                    aria-label="Hiện mật khẩu"
                                    aria-pressed="false"
                                >
                                    <span class="password-eye" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>

                        <label class="identity-field" for="register-confirmPassword">
                            Xác nhận mật khẩu
                            <input
                                id="register-confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Nhập lại mật khẩu"
                                minlength="8"
                                maxlength="128"
                                required
                            />
                        </label>

                        <button class="identity-action primary" type="submit" disabled>
                            Tạo tài khoản
                        </button>
                        <button class="identity-action quiet" type="button" data-cancel-auth hidden>
                            Hủy
                        </button>
                    </form>
                </section>
                <aside class="identity-cover">
                    <div class="identity-cover-art" aria-hidden="true">
                        <span class="identity-orbit orbit-outer"></span>
                        <span class="identity-orbit orbit-inner"></span>
                        <span class="identity-orbit orbit-tilt"></span>
                        <span class="identity-emblem">⚿</span>
                        <span class="identity-satellite satellite-app">▦</span>
                        <span class="identity-satellite satellite-user">♙</span>
                    </div>
                    <div class="identity-cover-copy">
                        <p>Một tài khoản cho các ứng dụng của bạn</p>
                    </div>

                    <a
                        class="identity-action identity-cover-action"
                        href="/login.html"
                        data-change-mode="login"
                    >
                        ← Về đăng nhập
                    </a>
                </aside>
            </div>
        </main>
        <script src="/js/portal-client.js?v=fast-entry-1"></script>
        <script src="/js/auth.js?v=fast-entry-1"></script>
    </body>
</html>
