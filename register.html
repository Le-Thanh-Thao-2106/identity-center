<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Đăng ký | Identity Center</title>
        <link rel="stylesheet" href="/css/portal.css?v=portal-1" />
    </head>
    <body class="identity-site">
        <main class="identity-shell">
            <header class="identity-topbar">
                <div class="identity-brand">
                    <span class="identity-mark" aria-hidden="true">◉</span>
                    <div>
                        <strong>Identity Center</strong>
                        <small>Không gian ứng dụng</small>
                    </div>
                </div>
            </header>

            <div class="identity-auth">
                <aside class="identity-cover">
                    <div class="identity-cover-art" aria-hidden="true">
                        <span class="identity-orbit orbit-outer"></span>
                        <span class="identity-orbit orbit-inner"></span>
                        <span class="identity-orbit orbit-tilt"></span>
                        <span class="identity-emblem">⚿</span>
                        <span class="identity-satellite satellite-app">▦</span>
                        <span class="identity-satellite satellite-user">♙</span>
                    </div>
                    <div class="identity-cover-copy">
                        <p>Một tài khoản cho các ứng dụng của bạn</p>
                    </div>
                </aside>
                <section class="identity-form-panel" aria-labelledby="identityHeading">
                    <nav class="identity-segment" aria-label="Thao tác tài khoản">
                        <a href="/login.html">Đăng nhập</a>
                        <a href="/register.html" aria-current="page">Đăng ký</a>
                    </nav>
                    <div class="identity-form-title">
                        <h2 id="identityHeading">Tạo tài khoản</h2>
                        <p>Tạo tài khoản để sử dụng các ứng dụng trong Identity Center.</p>
                    </div>
                    <p class="identity-message" id="authMessage" role="status" hidden></p>
                    <form
                        id="identityForm"
                        class="identity-form"
                        data-mode="register"
                        autocomplete="off"
                    >
                        <label class="identity-field" for="fullName">
                            Họ và tên
                            <input
                                id="fullName"
                                type="text"
                                placeholder="Nguyễn Minh An"
                                maxlength="120"
                                required
                            />
                        </label>

                        <label class="identity-field" for="email">
                            Email
                            <input
                                id="email"
                                type="email"
                                placeholder="ban@example.com"
                                maxlength="254"
                                autocapitalize="none"
                                spellcheck="false"
                                required
                            />
                        </label>
                        <div class="identity-field">
                            <label for="password">Mật khẩu</label>
                            <div class="identity-password">
                                <input
                                    id="password"
                                    type="password"
                                    placeholder="Ít nhất 8 ký tự"
                                    autocomplete="new-password"
                                    minlength="8"
                                    maxlength="128"
                                    required
                                />
                                <button
                                    id="passwordToggle"
                                    type="button"
                                    class="identity-action"
                                    aria-label="Hiện mật khẩu"
                                    aria-pressed="false"
                                >
                                    <span class="password-eye" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>

                        <label class="identity-field" for="confirmPassword">
                            Xác nhận mật khẩu
                            <input
                                id="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Nhập lại mật khẩu"
                                minlength="8"
                                maxlength="128"
                                required
                            />
                        </label>

                        <button class="identity-action primary" type="submit" disabled>
                            Tạo tài khoản
                        </button>
                    </form>
                </section>
            </div>
        </main>
        <script src="/js/portal-client.js?v=portal-1"></script>
        <script src="/js/auth.js?v=portal-1"></script>
    </body>
</html>
