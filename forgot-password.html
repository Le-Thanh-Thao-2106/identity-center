<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu | Identity Center</title><link rel="stylesheet" href="css/style.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#f4f6fc}.reset-card{background:white;padding:32px;border-radius:20px;max-width:420px;width:92%;box-shadow:0 14px 45px #20315a18}.reset-card input,.reset-card button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0;border-radius:10px;border:1px solid #dce3f2}.reset-card button{background:#3657bd;color:white;cursor:pointer}.reset-card a{color:#3657bd}</style></head><body><main class="reset-card"><h2>Khôi phục mật khẩu</h2><p>Nhập email đã đăng ký. Identity Center sẽ gửi liên kết đặt lại mật khẩu.</p><form id="resetRequest"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Gửi liên kết</button></form><p id="message" role="status"></p><a href="login.html?from=breastcare">Quay lại đăng nhập</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/forgot-password.js"></script></body></html>
