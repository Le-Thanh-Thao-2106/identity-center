<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu | Identity Center</title><link rel="stylesheet" href="css/style.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#f4f6fc}.reset-card{background:white;padding:32px;border-radius:20px;max-width:420px;width:92%}.reset-card input,.reset-card button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0;border-radius:10px;border:1px solid #dce3f2}.reset-card button{background:#3657bd;color:white}</style></head><body><main class="reset-card"><h2>Đặt mật khẩu mới</h2><form id="resetForm"><input id="newPassword" type="password" minlength="8" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" required><input id="confirmPassword" type="password" minlength="8" placeholder="Nhập lại mật khẩu" required><button type="submit">Lưu mật khẩu</button></form><p id="message" role="status">Vui lòng mở trang này từ liên kết trong email.</p><a href="login.html?from=breastcare">Quay lại đăng nhập</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/forgot-password.js"></script></body></html>
